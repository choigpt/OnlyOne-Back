# =============================================================
# API 모듈 테스트 설정 (profile: test)
# H2 인메모리 DB + 캐시 비활성화 + 축소된 리소스 한도
# 통합 테스트(Testcontainers)는 ES, Kafka, Redis 별도 구동
# =============================================================

# --- H2 인메모리 DB (MySQL 호환 모드) ---
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop     # 테스트마다 스키마 재생성
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Kafka (테스트용 최소 설정)
  kafka:
    enabled: true
    default-bootstrap-servers: localhost:9092
    producer:
      common-config:
        client-id: test-producer
        bootstrap-servers:
          - localhost:9092
        transactional-id-prefix: test-tx-
        acks: all
        linger-ms: 0
        batch-size: 16384
      settlement-process-producer-config:
        topic: settlement.process.v1
    consumer:
      common-config:
        group-id: test-group
        client-id: test-consumer
        bootstrap-servers:
          - localhost:9092
        timeout-ms: "5000"
        fetch-min-bytes: 1
        fetch-max-wait-ms: 100
      user-settlement-ledger-consumer-config:
        topic: user-settlement.result.v1
    security:
      enabled: false

  # Redis / Elasticsearch (Testcontainers 또는 로컬)
  data:
    redis:
      host: localhost
      port: 6379
      password:
  elasticsearch:
    uris: http://localhost:9200

  cache:
    type: none                  # 캐시 비활성화 (테스트 격리)

# --- 외부 연동 테스트 더미 값 ---
payment:
  toss:
    client_key: test_key
    test_secret_api_key: test_secret
    security_key: test_security
    base_url: https://api.tosspayments.com/v1/payments

jwt:
  secret: 7e9eeb12d176a2d72f554c6b096522b4e1a34d799727e45a96f192bbff2a2a851ede29ed24b10b6e6b1835ac94380e2469df99ff9713477bf4d43eeaa9cd16a3
  access-expiration: 3600000
  refresh-expiration: 604800000

Kakao:
  client:
    id: test
  redirect:
    uri: http://localhost/callback

aws:
  s3:
    region: ap-northeast-2
    bucket: test-bucket
    folder:
      chat: chat
      club: club
      feed: feed
      user: user
  cloudfront:
    domain: test.cloudfront.net

# --- 축소된 리소스 한도 (테스트 속도 우선) ---
app:
  base-url: http://localhost:8080
  feed-like-stream:
    enabled: false
  cors:
    allowed-origins: http://localhost:8080
  rate-limit:
    enabled: false
  settlement:
    concurrency: 4
    shutdown:
      await-seconds: 5
  notification:
    sse-timeout-millis: 5000
    max-connections: 100
    cleanup-interval-minutes: 1
    batch-size: 5
    max-queue-size-per-user: 10
    batch-processing-interval: 100
    batch-timeout-seconds: 5
    sse-executor-permits: 10
    notification-executor-permits: 10

logging:
  level:
    root: WARN
    com.example.onlyone: INFO
