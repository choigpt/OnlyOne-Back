# =============================================================
# 개발 서버 환경 설정 (profile: dev)
# 부하 테스트 및 성능 검증을 위한 높은 리소스 한도 적용
# 모든 민감 값은 환경변수로 주입
# =============================================================

# --- 데이터소스 (HikariCP 확장 풀) ---
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 100     # 부하 테스트 대응
      minimum-idle: 50
      connection-timeout: 5000   # 빠른 실패 (5초)
      idle-timeout: 300000
      max-lifetime: 1800000
      auto-commit: false         # 트랜잭션 성능 최적화

  # JPA: 스키마 검증만 (DDL 변경 불가), 배치 INSERT/UPDATE
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        show_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true  # auto-commit false와 함께 사용

  # Redis (커넥션 풀 확장)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 50
          max-idle: 30
          min-idle: 10

  # Elasticsearch
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD}

  # 캐시: Redis 기반, TTL 10분
  cache:
    type: redis
    redis:
      time-to-live: 600000

# --- 로깅: INFO 수준 (디버그 로그 비활성화) ---
logging:
  level:
    root: INFO
    com.example.onlyone: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

# --- Tomcat (부하 테스트용 확장 스레드) ---
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 400
      min-spare: 20

# --- AWS ---
aws:
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

Kakao:
  redirect:
    uri: ${KAKAO_REDIRECT_URI}

# --- Rate Limit 활성화 ---
app:
  rate-limit:
    enabled: true
    requests-per-minute: 60
    auth-requests-per-30s: 10
