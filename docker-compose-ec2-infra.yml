# =============================================================
# EC2 인프라 서버 전용 Docker Compose (t3.large: 2 vCPU, 8GB)
# 총 메모리 할당 ~6GB, 나머지 OS/swap용
# =============================================================
# 사용법:
#   INFRA_PRIVATE_IP=10.0.1.x docker compose -f docker-compose-ec2-infra.yml up -d
# =============================================================

services:
  # ── MySQL 8.0 (2.5GB) ──
  mysql:
    image: mysql:8.0
    container_name: onlyone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: onlyone
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./onlyone-api/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
      - --innodb_buffer_pool_size=1536M
      - --innodb_buffer_pool_instances=2
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_lock_wait_timeout=5
      - --innodb_thread_concurrency=0
      - --innodb_io_capacity=2000
      - --innodb_io_capacity_max=4000
      - --innodb_read_io_threads=4
      - --innodb_write_io_threads=4
      - --innodb_redo_log_capacity=256M
      - --innodb_log_buffer_size=32M
      - --sync_binlog=0
      - --thread_cache_size=100
      - --sort_buffer_size=2M
      - --join_buffer_size=2M
      - --tmp_table_size=32M
      - --max_heap_table_size=32M
      - --table_open_cache=1000
      - --innodb_adaptive_hash_index=ON
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2560M
        reservations:
          cpus: '0.5'
          memory: 1G

  # ── Redis 7 (512MB) ──
  redis:
    image: redis:7-alpine
    container_name: onlyone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru --save ""
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ── Elasticsearch 8.18.1 (1.25GB) ──
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    container_name: onlyone-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-changeme}
      - cluster.name=onlyone-cluster
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./onlyone-api/src/main/resources/elasticsearch:/usr/share/elasticsearch/config/analysis
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u elastic:${ELASTICSEARCH_PASSWORD:-changeme} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1280M
        reservations:
          cpus: '0.25'
          memory: 512M

  # ── MongoDB 7.0 (1GB) ──
  mongodb:
    image: mongo:7.0
    container_name: onlyone-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: onlyone
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5", "--auth"]
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "root", "-p", "root", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ── Kafka 3.8 KRaft (768MB) ──
  kafka:
    image: apache/kafka:3.8.0
    container_name: onlyone-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${INFRA_PRIVATE_IP:-localhost}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "onlyone-kafka-cluster-001"
      KAFKA_HEAP_OPTS: "-Xms192m -Xmx384m"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 192M

  # ========== Monitoring (~512MB total) ==========

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: onlyone-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-ec2.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-remote-write-receiver'
    networks:
      - onlyone-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: onlyone-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - onlyone-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 64M

  # MySQL Exporter
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: onlyone-mysql-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_PASSWORD:-root}
    command:
      - '--mysqld.address=mysql:3306'
      - '--mysqld.username=root'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - onlyone-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 48M

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: onlyone-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - onlyone-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 48M

networks:
  onlyone-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  elasticsearch_data:
  mongodb_data:
  kafka_data:
  prometheus_data:
  grafana_data:
