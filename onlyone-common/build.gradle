plugins {
    id 'java'
    id 'java-library'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('querydslVersion', '5.1.0')
}

dependencies {
    // QueryDSL
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.2.0'


    // Spring Web (필요한 어노테이션과 클래스)
    api 'org.springframework:spring-web:6.2.2'
    api 'org.springframework:spring-webmvc:6.2.2'

    // Spring Data JPA (BaseTimeEntity용)
    api 'org.springframework.data:spring-data-jpa:3.4.2'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.2.0'

    // Servlet API
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    // OpenAPI/Swagger
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Logging
    api 'org.slf4j:slf4j-api:2.0.16'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Jackson (JSON 처리)
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    // Validation
    api 'jakarta.validation:jakarta.validation-api:3.1.0'

    // Tomcat (for ClientAbortException)
    compileOnly 'org.apache.tomcat.embed:tomcat-embed-core:11.0.4'

    // Test
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

// QueryDSL 설정
def querydslDir = layout.buildDirectory.dir('generated/querydsl')

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = querydslDir
    options.compilerArgs += ["--enable-preview"]
}

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

clean {
    delete querydslDir
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += "--enable-preview"
}
